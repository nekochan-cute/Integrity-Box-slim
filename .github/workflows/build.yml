name: Build

on:
  workflow_dispatch:
  push:
    branches: main
    paths-ignore: '**.md'
  pull_request:
    paths-ignore: '**.md'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Build
      run: sh build.sh --gradle

    - name: Upload module
      uses: actions/upload-artifact@v7
      with:
        name: Integrity-Box-Slim-CI_#${{ github.run_number }}
        path: 'out/module/*'
        compression-level: 9
